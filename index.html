<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>Golden Ramen — Menú Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aladin&family=Mulish:wght@500;700;800;900&family=Noto+Sans+JP:wght@500&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#FFC20E;--gold2:#EFA92B;--red:#FF3B2F;--bg:#0d0d0d;--card:#171717}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg) radial-gradient(ellipse at 50% 0%,#2a2108 0%,#0d0d0d 55%) no-repeat;color:#f3f3f3;font-family:Mulish,'Noto Sans SC',sans-serif;-webkit-font-smoothing:antialiased}
body.zh{font-family:'Noto Sans SC',Mulish,sans-serif}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
button{font-family:inherit}
.flag{display:block;width:100%;height:100%;border-radius:4px;overflow:hidden;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
#intro{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(ellipse at 50% 45%,#2d2208 0%,#0c0c0c 60%,#050505 100%);transition:opacity .9s ease,visibility .9s;padding:20px;text-align:center}
#intro.out{opacity:0;visibility:hidden}
.ring{position:relative;width:min(60vw,44vh,380px);aspect-ratio:1}
.ring svg{position:absolute;inset:-7%;width:114%;height:114%}
.ring circle{fill:none;stroke-linecap:round}
.c1{stroke:var(--gold2);stroke-width:5;stroke-dasharray:580;stroke-dashoffset:580}
.c2{stroke:var(--gold);stroke-width:2;stroke-dasharray:530;stroke-dashoffset:530;opacity:.7}
.ring .lg{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.94);filter:drop-shadow(0 0 4px rgba(255,194,14,.2))}50%{transform:scale(1);filter:drop-shadow(0 0 18px rgba(255,194,14,.5))}}
.shine{position:absolute;inset:6%;border-radius:50%;overflow:hidden;pointer-events:none}
.shine::after{content:"";position:absolute;top:-30%;left:-70%;width:40%;height:160%;background:linear-gradient(100deg,transparent,rgba(255,240,200,.55),transparent);transform:rotate(18deg)}
#intro .word{width:min(74vw,400px)}
#intro .tg{font-weight:900;letter-spacing:.55em;font-size:12px;color:var(--gold2)}
#intro .tap{margin-top:6px;font-weight:900;font-size:14px;letter-spacing:.3em;color:#1a1a1a;background:var(--gold);border:0;border-radius:999px;padding:13px 30px;box-shadow:0 8px 24px rgba(255,194,14,.3);animation:tp 1.6s ease-in-out infinite;cursor:pointer}
@keyframes tp{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.iflags{display:flex;gap:14px;margin-top:4px}
.iflags button{width:64px;height:44px;padding:0;border:2px solid transparent;border-radius:8px;background:none;cursor:pointer;opacity:.55;transition:all .2s}
.iflags button.on{opacity:1;border-color:var(--gold);transform:scale(1.1);box-shadow:0 0 16px rgba(255,194,14,.45)}
#intro.go .lg{animation:logoIn 1.3s cubic-bezier(.2,1.3,.4,1) forwards,breathe 2.4s 1.4s ease-in-out infinite}
@keyframes logoIn{0%{transform:scale(.35) rotate(-200deg);opacity:.2}100%{transform:scale(1) rotate(0);opacity:1}}
#intro.go .c1{animation:draw 1.4s .1s ease forwards}
#intro.go .c2{animation:draw 1.6s .3s ease forwards}
#intro.go svg{animation:spin 2s cubic-bezier(.6,.05,.3,1) both}
#intro.go .shine::after{animation:sweep 1.1s 1.2s ease-in-out}
#intro.go .word{opacity:0;transform:translateY(16px);animation:up .9s 1.1s ease forwards}
#intro.go .tg{opacity:0;animation:up .8s 1.5s ease forwards}
#intro.go .tap,#intro.go .iflags{display:none}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{from{transform:rotate(-140deg)}to{transform:rotate(0)}}
@keyframes sweep{from{left:-70%}to{left:140%}}
@keyframes up{to{opacity:1;transform:none}}
header{position:sticky;top:0;z-index:20;background:rgba(13,13,13,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(239,169,43,.35);padding-top:env(safe-area-inset-top)}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 14px;max-width:1200px;margin:0 auto}
.brand{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;text-align:center}
.brand img{width:40px;height:40px}
.brand .t{font-family:Aladin,serif;font-size:25px;color:var(--gold);line-height:1}
.brand small{display:block;font-family:Mulish,sans-serif;font-size:9.5px;letter-spacing:.32em;color:var(--gold2);margin-top:3px}
body.zh .brand small{letter-spacing:.5em;font-family:'Noto Sans SC'}
.lt{display:flex;align-items:center;gap:10px}
.rt{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.cur{font-weight:900;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2)}
.ib{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--gold);background:rgba(255,194,14,.08);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer;padding:0;color:var(--gold);flex:0 0 auto;transition:background .2s,transform .15s}
.ib:active{transform:scale(.92)}
.ib.on{background:var(--gold);color:#1a1a1a}
.mb span{display:block;width:22px;height:2.5px;border-radius:2px;background:var(--gold);transition:transform .25s,opacity .25s}
.mb.on{background:rgba(255,194,14,.08)}
.mb.on span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
.mb.on span:nth-child(2){opacity:0}
.mb.on span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
.lb{padding:9px}
.lb .flag{border-radius:3px}
.dd{position:absolute;top:calc(100% + 6px);background:#121212;border:1.5px solid var(--gold2);border-radius:18px;box-shadow:0 24px 50px rgba(0,0,0,.7);padding:8px;opacity:0;visibility:hidden;transform:translateY(-8px);transition:all .22s;z-index:26}
.dd.on{opacity:1;visibility:visible;transform:none}
nav.dd{left:12px;width:min(340px,calc(100vw - 24px));max-height:calc(100dvh - 110px);overflow:auto;display:flex;flex-direction:column}
nav a{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:800;font-size:16.5px;color:#f3f3f3;padding:9px 10px;border-radius:12px}
nav a img{width:46px;height:38px;object-fit:contain;flex:0 0 auto}
nav a span{flex:1}
nav a small{font-family:'Noto Sans JP',sans-serif;font-weight:500;font-size:11px;color:var(--gold2);letter-spacing:.15em}
nav a.on,nav a:hover{background:var(--gold);color:#1a1a1a}
nav a.on small,nav a:hover small{color:#1a1a1a}
#langdd{right:12px;display:flex;flex-direction:column;gap:4px;min-width:210px}
#langdd button{display:flex;align-items:center;gap:12px;background:none;border:0;color:#f3f3f3;font-weight:800;font-size:16px;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left}
#langdd button i{display:block;width:40px;height:27px;flex:0 0 auto}
#langdd button.on,#langdd button:hover{background:var(--gold);color:#1a1a1a}
.sp{position:absolute;left:0;right:0;top:100%;background:rgba(13,13,13,.97);border-bottom:1px solid rgba(239,169,43,.45);box-shadow:0 20px 40px rgba(0,0,0,.6);padding:12px 16px 14px;opacity:0;visibility:hidden;transform:translateY(-8px);transition:all .22s;z-index:25}
.sp.on{opacity:1;visibility:visible;transform:none}
.sbox{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;border:1.5px solid var(--gold);border-radius:14px;padding:0 6px 0 14px;background:#181818;color:var(--gold)}
.sbox input{flex:1;min-width:0;background:none;border:0;outline:none;color:#fff;font:700 18px Mulish,'Noto Sans SC',sans-serif;padding:13px 0}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox button{width:38px;height:38px;border:0;border-radius:10px;background:none;color:var(--gold);font-size:18px;font-weight:900;cursor:pointer}
.sr{max-width:760px;margin:8px auto 0;max-height:calc(100dvh - 190px);overflow:auto}
.sr:empty{display:none}
.ri{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.07);padding:9px 6px;color:inherit;font:inherit;cursor:pointer;border-radius:12px}
.ri:hover,.ri:focus-visible{background:rgba(255,194,14,.12);outline:none}
.ri img,.ri .ni{width:62px;height:52px;object-fit:contain;flex:0 0 auto}
.ri .rx{flex:1;min-width:0}
.ri b{display:block;color:var(--gold);font-size:16.5px;font-weight:900;line-height:1.2}
.ri b mark{background:rgba(255,194,14,.3);color:#fff;border-radius:3px}
.ri small{display:block;color:#bbb;font-size:12.5px;letter-spacing:.06em;margin-top:2px}
.ri .rp{font-weight:900;color:#1a1a1a;background:var(--gold);border-radius:8px;padding:3px 9px;font-size:14.5px;white-space:nowrap}
.sx{color:#bbb;text-align:center;padding:18px 6px;font-size:15px}
#scrim{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .2s}
#scrim.on{opacity:1;visibility:visible}
main{max-width:1200px;margin:0 auto;padding:6px 16px 30px}
.ex{padding-top:18px}
.ex h2{margin:0 0 4px;font-family:Aladin,serif;font-weight:400;font-size:30px;color:var(--gold)}
body.zh .ex h2,body.zh .sh h2{font-family:'Noto Sans SC';font-weight:900}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 16px 14px;margin:0 -16px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.ct{flex:0 0 132px;scroll-snap-align:start;border:1px solid rgba(239,169,43,.45);border-radius:18px;background:linear-gradient(160deg,rgba(255,194,14,.16),#151515 55%);padding:10px 8px 12px;color:inherit;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s,border-color .2s,box-shadow .2s}
.ct:hover,.ct.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,194,14,.35)}
.ct:active{transform:scale(.95)}
.ct img{width:100%;height:78px;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.6));transition:transform .35s}
.ct:hover img{transform:scale(1.08) rotate(-3deg)}
.ct b{font-weight:900;font-size:14.5px;line-height:1.15;color:var(--gold)}
.ct small{font-size:11px;color:#bbb;font-weight:700}
section{padding-top:26px}
.sh{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:0 0 6px}
.sh h2{margin:0;font-family:Aladin,serif;font-weight:400;font-size:44px;line-height:1;color:var(--gold)}
.sh .jp{font-family:'Noto Sans JP',sans-serif;color:var(--gold2);letter-spacing:.35em;font-size:16px;padding-bottom:6px}
.sh .spk{margin-left:auto;align-self:center;width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(239,169,43,.6);background:none;color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center}
.bar{height:3px;width:80px;background:var(--gold);border-radius:2px;margin:8px 0 14px}
.note{color:#e9e9e9;font-size:16px;line-height:1.55;margin:0 0 14px;max-width:760px;text-align:justify;hyphens:auto}
.bases{margin:4px 0 22px;max-width:760px;padding:16px 14px 18px;border-radius:18px;background:linear-gradient(180deg,rgba(255,59,47,.10),rgba(255,59,47,.02));border:1px solid rgba(255,59,47,.35)}
.bases .bl{display:flex;align-items:center;gap:12px;justify-content:center;font-weight:900;font-size:12px;letter-spacing:.35em;color:#f3f3f3;margin-bottom:14px;padding-left:.35em}
.bases .bl::before,.bases .bl::after{content:"";flex:1;max-width:90px;height:1.5px;background:linear-gradient(90deg,transparent,var(--red))}
.bases .bl::after{transform:scaleX(-1)}
.bases .bw{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 6px}
.bases .b{flex:0 0 calc(33.33% - 6px);max-width:120px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;background:none;border:0;color:inherit;padding:0}
.bases .hk{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff5a4a,#C8231A 70%);box-shadow:0 0 0 3px #121212,0 0 0 4.5px var(--red),0 6px 16px rgba(255,59,47,.35);display:flex;align-items:center;justify-content:center;font-family:'Noto Sans JP',sans-serif;font-weight:500;color:#fff4e0;font-size:20px;transform:rotate(-8deg);transition:transform .3s}
.bases .b:nth-child(even) .hk{transform:rotate(7deg)}
.bases .b:active .hk,.bases .b:hover .hk{transform:rotate(0) scale(1.1)}
.bases .nm{font-family:Aladin,'Noto Sans SC',serif;font-size:23px;line-height:1;color:#FF4A3D;text-shadow:0 2px 10px rgba(255,59,47,.3);text-align:center}
@media (min-width:601px){.bases .b{flex:0 0 120px}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.it{position:relative;display:flex;flex-direction:column;text-align:left;background:linear-gradient(160deg,rgba(255,194,14,.10),var(--card) 45%);border:1px solid rgba(239,169,43,.45);border-radius:18px;padding:0;color:inherit;font:inherit;cursor:pointer;overflow:hidden;opacity:0;transform:translateY(22px) scale(.98);transition:transform .5s cubic-bezier(.2,.9,.3,1),opacity .5s,border-color .2s,box-shadow .2s}
.it.in{opacity:1;transform:none}
.it.in:hover,.it:focus-visible{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 14px 30px rgba(0,0,0,.5),0 0 0 2px rgba(255,194,14,.25);outline:none}
.it.in:active{transform:scale(.97)}
.it .ph{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;padding:12px;background:radial-gradient(closest-side,rgba(255,194,14,.2),transparent)}
.it .ph img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6));transition:transform .45s cubic-bezier(.2,.9,.3,1)}
.it:hover .ph img{transform:scale(1.07) rotate(-2deg)}
.it .tx{padding:4px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.it h3{margin:0;font-weight:900;font-size:19px;line-height:1.2;color:var(--gold)}
.it p{margin:0;font-size:14.5px;line-height:1.45;color:#e6e6e6;text-align:justify;hyphens:auto;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .pr{margin-top:auto;align-self:flex-start;font-weight:900;font-size:18px;color:#1a1a1a;background:var(--gold);border-radius:10px;padding:4px 12px}
.it .tag{position:absolute;top:10px;left:10px;font-weight:900;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#1a1a1a;background:var(--gold);border-radius:999px;padding:4px 10px;z-index:1}
.it .more{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:rgba(13,13,13,.75);border:1.5px solid var(--gold);color:var(--gold);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:16px}
.rip{position:absolute;border-radius:50%;background:rgba(255,194,14,.35);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.list{margin-top:16px;background:var(--card);border:1px solid rgba(239,169,43,.45);border-radius:18px;padding:14px 18px}
.list h4{margin:0 0 8px;font-weight:900;letter-spacing:.2em;font-size:13px;color:var(--gold2);text-transform:uppercase}
.list div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dotted rgba(255,255,255,.2);font-size:16px;font-weight:700}
.list div:last-child{border:0}
.list b{color:var(--gold);font-weight:900;white-space:nowrap}
footer{border-top:1px solid rgba(239,169,43,.35);padding:28px 16px calc(130px + env(safe-area-inset-bottom));text-align:center;background:#090909}
footer .sucs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;max-width:820px;margin:0 auto 16px}
footer .suc{border:1px solid rgba(239,169,43,.5);border-radius:14px;padding:14px}
footer .suc h5{margin:0 0 6px;color:var(--gold);letter-spacing:.15em;font-size:12px;text-transform:uppercase}
footer a{color:var(--gold);text-decoration:none;font-weight:900;font-size:18px}
footer p{margin:6px 0;color:#ddd;font-size:14px;line-height:1.45}
footer .soc{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:10px 0}
footer .soc a{font-size:15px}
footer .al{color:#aaa;font-size:13px;margin-top:14px}
footer .dev{margin-top:18px;font-size:12px;color:#888;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
footer .dev button{font-weight:800;color:#1a1a1a;background:var(--gold);border:0;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:12px}
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.78);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#modal.on{opacity:1;visibility:visible}
.mc{position:relative;width:min(580px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:linear-gradient(160deg,#241c08,#121212 45%);border:1.5px solid var(--gold2);border-radius:24px;box-shadow:0 30px 70px rgba(0,0,0,.7);transform:translateY(24px) scale(.96);transition:transform .3s cubic-bezier(.2,1.2,.4,1)}
#modal.on .mc{transform:none}
.mc.sl{animation:slideL .35s ease}.mc.sr2{animation:slideR .35s ease}
@keyframes slideL{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
.mc .mph{position:relative;display:flex;align-items:center;justify-content:center;padding:26px 22px 6px;background:radial-gradient(closest-side,rgba(255,194,14,.25),transparent)}
.mc .mph img{max-height:42vh;object-fit:contain;filter:drop-shadow(0 16px 22px rgba(0,0,0,.7));animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.85) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.mc .bd{padding:8px 26px 18px}
.mc .mtag{display:inline-block;font-weight:900;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#1a1a1a;background:var(--gold);border-radius:999px;padding:4px 12px;margin-bottom:6px}
.mc h3{margin:4px 0;font-weight:900;font-size:30px;line-height:1.15;color:var(--gold)}
.mc .orig{font-size:14px;color:#aaa;font-weight:700;margin-top:2px}
.mc .ln{width:56px;height:3px;background:var(--gold2);border-radius:2px;margin:10px 0 14px}
.mc p{margin:0 0 16px;font-size:19px;line-height:1.6;font-weight:500;color:#f5f5f5;text-align:justify;hyphens:auto}
.mc .rows{display:grid;gap:8px;margin-bottom:16px}
.mc .row{display:flex;justify-content:space-between;gap:12px;font-size:18px;font-weight:700;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.06)}
.mc .row b{color:var(--gold);font-weight:900}
.mc .pl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mc .price{display:inline-block;font-weight:900;font-size:30px;color:#1a1a1a;background:var(--gold);border-radius:14px;padding:6px 18px}
.mc .lis{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--gold);border-radius:14px;background:rgba(255,194,14,.08);color:var(--gold);font-weight:900;font-size:15px;padding:11px 14px;cursor:pointer}
.mc .lis.on{background:var(--gold);color:#1a1a1a}
.mc .x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--gold);background:rgba(10,10,10,.85);color:var(--gold);font-size:22px;font-weight:900;cursor:pointer;z-index:2}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px 18px}
.mnav button{flex:0 0 auto;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--gold2);background:rgba(255,194,14,.06);color:var(--gold);font-size:26px;line-height:1;font-weight:900;cursor:pointer}
.mnav button:disabled{opacity:.25;cursor:default}
.mnav .dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.mnav .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);transition:all .25s}
.mnav .dots i.on{background:var(--gold);width:18px;border-radius:4px}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;display:flex;flex-direction:column;gap:10px}

<script>

function trRow(r){const m=r.match(/^(.*?)\s*(\$\s?\d[\d,.]*)$/);return m?[tr(m[1]),m[2]]:[tr(r),'']}
const nav=$('nav'), main=$('main'), SM={}; S.forEach(s=>SM[s.id]=s);
const KJ={'tonkotsu':'豚骨','miso':'味噌','spicy':'辛','buche':'モツ','de res':'牛'};
const secImg=s=>{const it=s.items.find(x=>x.i);return it?`i/${it.i}.webp?v=${V}`:'logo.webp'};

  let h=`<div class="ex"><h2>${esc(UI('explore'))}</h2><div class="car">${S.map(s=>`<button class="ct" data-id="${s.id}"><img src="${secImg(s)}" alt="" loading="lazy"><b>${esc(tr(s.t))}</b><small>${realItems(s).length} ${esc(UI('dishes'))}</small></button>`).join('')}</div></div>`;
  S.forEach(s=>{
    h+=`<section id="${s.id}"><div class="sh"><h2>${esc(tr(s.t))}</h2><span class="jp">${esc(s.jp)}</span><button class="spk" data-sec="${s.id}" aria-label="${esc(UI('listen'))}"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button></div><div class="bar"></div>`;
    if(s.note) h+=`<p class="note">${esc(tr(s.note))}</p>`;
    if(s.bases) h+=`<div class="bases"><div class="bl">${esc(UI('base'))}</div><div class="bw">${s.bases.map(b=>`<button class="b" data-say="${esc(tr(b))}"><span class="hk">${KJ[b.toLowerCase()]||esc(b[0])}</span><span class="nm">${esc(tr(b).replace(/(^|\s)\S/g,c=>c.toUpperCase()))}</span></button>`).join('')}</div></div>`;
    h+='<div class="grid">'+s.items.map((it,k)=>{if(isSub(s,it))return '';const pr=firstPrice(it);
      return `<button class="it" data-s="${s.id}" data-k="${k}">${it.tag?`<span class="tag">${esc(tr(it.tag))}</span>`:''}<span class="more" aria-hidden="true">+</span><div class="ph">${it.i?`<img loading="lazy" src="i/${it.i}.webp?v=${V}" alt="">`:''}</div><div class="tx"><h3>${esc(tr(it.n))}</h3>${it.d?`<p>${esc(tr(it.d))}</p>`:''}${pr?`<span class="pr">${esc(pr)}</span>`:''}</div></button>`}).join('')+'</div>';
    if(s.list&&s.list.length) h+=`<div class="list"><h4>${esc(tr(s.listT||''))}</h4>${s.list.map(([n,p])=>`<div><span>${esc(tr(n))}</span><b>${esc(p)}</b></div>`).join('')}</div>`;
    h+='</section>';
  });
  main.innerHTML=h;
  if(revealIO)revealIO.disconnect();
  revealIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const el=e.target,i=[...el.parentNode.children].indexOf(el);setTimeout(()=>el.classList.add('in'),(i%4)*70);revealIO.unobserve(el)}}),{rootMargin:'0px 0px -6% 0px'});
  document.querySelectorAll('.it').forEach(e=>revealIO.observe(e));
  spy.disconnect(); document.querySelectorAll('section').forEach(s=>spy.observe(s));
  $('langdd').innerHTML=LANGS.map(([c,n])=>`<button data-l="${c}" class="${c===lang?'on':''}"><i>${FLAG[c]}</i>${n}</button>`).join('');
  $('iflags').innerHTML=LANGS.map(([c,n])=>`<button data-l="${c}" class="${c===lang?'on':''}" aria-label="${n}">${FLAG[c]}</button>`).join('');
  IDX.length=0; S.forEach(s=>s.items.forEach((it,k)=>{if(isSub(s,it))return;const nn=tr(it.n);IDX.push({s,it,k,name:nn,key:nrm(nn),txt:nrm(nn+' '+it.n+' '+tr(it.d||'')+' '+(it.d||'')+' '+tr(s.t))})}));
  if(curSec)$('cur').textContent=tr(SM[curSec].t);

/* audio fx */
let AC=null, muted=store.get('gr_mute','0')==='1', voiceOn=store.get('gr_voice','1')==='1';
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,dur,type,vol,c,dest){const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+dur+.05)}
function gong(){if(muted)return;const c=ac();if(!c)return;const t=c.currentTime+.05,m=c.createGain();m.gain.value=.9;m.connect(c.destination);
  [[110,1],[164.8,.5],[220,.4],[296,.25],[392,.15]].forEach(([f,v])=>tone(f,t,4.2,'sine',.35*v,c,m));
  const n=c.createBufferSource(),b=c.createBuffer(1,Math.floor(c.sampleRate*.4),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900;const ng=c.createGain();ng.gain.value=.25;n.buffer=b;n.connect(bp);bp.connect(ng);ng.connect(m);n.start(t);
  [1318.5,1568,1975.5,2637].forEach((f,i)=>tone(f,t+1.15+i*.12,1.4,'triangle',.12,c,m))}
function tick(){if(muted)return;const c=ac();if(!c)return;const t=c.currentTime;tone(1568,t,.25,'triangle',.08,c,c.destination);tone(2349,t+.06,.3,'sine',.05,c,c.destination)}
function whoosh(){if(muted)return;const c=ac();if(!c)return;const t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(880,t+.18);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.06,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.25)}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
/* voice (female) */
const SS=window.speechSynthesis;
const FEM=/paulina|m[oó]nica|sabina|helena|laura|dalia|elvira|luc[ií]a|marisol|camila|paloma|renata|valeria|ximena|google espa|samantha|zira|aria|jenny|ava\b|allison|susan|karen|tessa|moira|victoria|serena|emma|michelle|google us english|ting-?ting|huihui|xiaoxiao|xiaoyi|yaoyao|meijia|sin-?ji|lili|google 普通话|google 國語|female|mujer|女/i;
const MALE=/jorge|juan|diego|pablo|ra[uú]l|alex\b|daniel|fred|david|mark|guy|kangkang|yunyang|yunxi|yunjian|carlos|enrique|gerardo|jos[eé]|alvaro|\bmale|hombre|\btom\b|aaron|arthur|eddy|grandpa|reed|rocko|ralph|bruce|junior|albert|男/i;
let VO=[]; function loadV(){VO=SS?SS.getVoices():[]} if(SS){loadV();SS.addEventListener&&SS.addEventListener('voiceschanged',loadV)}
function pickVoice(){const want=lang==='zh'?['zh-CN','zh-Hans','zh-TW','zh-HK','zh','cmn']:lang==='en'?['en-US','en-GB','en']:['es-MX','es-US','es-419','es-ES','es'];
  for(const w of want){const c=VO.filter(v=>v.lang.replace('_','-').toLowerCase().startsWith(w.toLowerCase()));if(!c.length)continue;
    const f=c.find(v=>FEM.test(v.name)&&!MALE.test(v.name));if(f)return f;const nm=c.find(v=>!MALE.test(v.name));if(nm)return nm}
  return null}
function say(text,force){if(!SS||!text)return;if(!force&&(!voiceOn||muted))return;
  try{SS.cancel();const u=new SpeechSynthesisUtterance(text),v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang=lang==='zh'?'zh-CN':lang==='en'?'en-US':'es-MX';

    $('talkt').textContent=text;SS.speak(u)}catch(e){}}
const pesos=p=>String(p).replace(/\$\s?(\d[\d,]*)/g,(m,n)=>lang==='zh'?n+UI('pesos'):n+' '+UI('pesos'));
function dishText(it){let t=tr(it.n).replace(/🔥/g,'')+'. ';if(it.d)t+=tr(it.d)+' ';
  if(it.r&&it.r.length)t+=it.r.map(r=>{const [a,b]=trRow(r);return a+(b?', '+pesos(b):'')}).join('; ')+'. ';
  const p=(it.p||[]).filter(Boolean);if(p.length)t+=UI('price')+': '+pesos(trPrice(p.join(', ')).replace(/\n/g,', '))+'.';
  return t}
const secText=s=>tr(s.t)+'. '+(s.note?tr(s.note):realItems(s).length+' '+UI('dishes')+'.');
let tT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),1600)}
function fabUI(){$('snd').classList.toggle('off',muted);$('vb').classList.toggle('on',voiceOn&&!muted);$('vb').classList.toggle('off',!voiceOn)}

$('vb').onclick=()=>{voiceOn=!voiceOn;store.set('gr_voice',voiceOn?'1':'0');fabUI();toast(UI(voiceOn?'voiceOn':'voiceOff'));if(voiceOn)say(UI('voiceOn'));else if(SS)SS.cancel()};
/* dropdowns */
const scrim=$('scrim'),mb=$('mb'),sb=$('sb'),sp=$('sp'),langdd=$('langdd'),lb=$('lb');

function goSec(id){closeAll();document.getElementById(id).scrollIntoView({behavior:'smooth'});whoosh();buzz(10);say(secText(SM[id]))}

langdd.addEventListener('click',e=>{const b=e.target.closest('button');if(b)setLang(b.dataset.l,true)});
$('iflags').addEventListener('click',e=>{const b=e.target.closest('button');if(b){e.stopPropagation();setLang(b.dataset.l,false);tick()}});
/* search */
const sq=$('sq'),sr=$('sr');
function hl(name,q){const n=nrm(name),i=n.indexOf(q);if(!q||i<0)return esc(name);return esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+q.length))+'</mark>'+esc(name.slice(i+q.length))}
sq.addEventListener('input',()=>{const q=nrm(sq.value.trim());if(!q){sr.innerHTML='';return}
  const ws=q.split(/\s+/);
  const res=IDX.filter(x=>ws.every(w=>x.txt.includes(w))).sort((a,b)=>(b.key.startsWith(q)-a.key.startsWith(q))||(b.key.includes(q)-a.key.includes(q))).slice(0,40);
  sr.innerHTML=res.length?res.map(x=>{const pr=firstPrice(x.it);return `<button class="ri" data-s="${x.s.id}" data-k="${x.k}">${x.it.i?`<img loading="lazy" src="i/${x.it.i}.webp?v=${V}" alt="">`:'<span class="ni"></span>'}<span class="rx"><b>${hl(x.name,q)}</b><small>${esc(tr(x.s.t))}</small></span>${pr?`<span class="rp">${esc(pr)}</span>`:''}</button>`}).join(''):`<div class="sx">${esc(UI('none'))} “${esc(sq.value)}”.</div>`});
sr.addEventListener('click',e=>{const b=e.target.closest('.ri');if(!b)return;closeAll();tick();openItem(b.dataset.s,+b.dataset.k)});
$('sc').onclick=()=>{if(sq.value){sq.value='';sr.innerHTML='';sq.focus()}else closeAll()};
/* main clicks */
main.addEventListener('click',e=>{
  const ct=e.target.closest('.ct');if(ct){goSec(ct.dataset.id);return}
  const sk=e.target.closest('.spk');if(sk){tick();say(secText(SM[sk.dataset.sec]),true);return}
  const bb=e.target.closest('.b');if(bb){tick();buzz(8);say(bb.dataset.say);return}
  const b=e.target.closest('.it');if(!b)return;
  const r=b.getBoundingClientRect(),sz=Math.max(r.width,r.height),rp=document.createElement('span');rp.className='rip';rp.style.cssText=`width:${sz}px;height:${sz}px;left:${e.clientX-r.left-sz/2}px;top:${e.clientY-r.top-sz/2}px`;b.appendChild(rp);setTimeout(()=>rp.remove(),650);
  tick();buzz(12);openItem(b.dataset.s,+b.dataset.k)});
/* modal */
const modal=$('modal'),mc=modal.querySelector('.mc');let mS=null,mK=0;
const listIdx=s=>s.items.map((it,k)=>k).filter(k=>!isSub(s,s.items[k]));
function fill(dir){
  const s=SM[mS],it=s.items[mK],ks=listIdx(s),pos=ks.indexOf(mK);
  const im=$('mi');if(it.i){im.src='i/'+it.i+'.webp?v='+V;im.alt=tr(it.n);im.parentElement.style.display='';im.style.animation='none';void im.offsetHeight;im.style.animation=''}else im.parentElement.style.display='none';
  const mg=$('mg');mg.textContent=it.tag?tr(it.tag):'';mg.style.display=it.tag?'':'none';
  $('mt').textContent=tr(it.n);const mo=$('mo');mo.textContent=(lang!=='es'&&tr(it.n)!==it.n)?it.n:'';mo.style.display=mo.textContent?'':'none';
  const md=$('md');md.textContent=it.d?tr(it.d):'';md.style.display=it.d?'':'none';
  const mr=$('mr');mr.innerHTML='';(it.r||[]).forEach(r=>{const [a,b]=trRow(r);const d=document.createElement('div');d.className='row';d.innerHTML='<span></span><b></b>';d.firstChild.textContent=a;d.lastChild.textContent=b;mr.appendChild(d)});mr.style.display=(it.r||[]).length?'':'none';
  const mp=$('mp'),pr=(it.p||[]).filter(Boolean);mp.textContent=trPrice(pr.join(' · ')).replace(/\n/g,' · ');mp.style.display=pr.length?'':'none';
  $('mpv').disabled=pos<=0;$('mnx').disabled=pos>=ks.length-1;
  $('mdots').innerHTML=ks.length>1&&ks.length<=14?ks.map((k,i)=>`<i class="${i===pos?'on':''}"></i>`).join(''):`<b style="color:var(--gold)">${pos+1} / ${ks.length}</b>`;
  mc.classList.remove('sl','sr2');if(dir){void mc.offsetWidth;mc.classList.add(dir>0?'sl':'sr2')}
  mc.scrollTop=0;say(dishText(it))}
function openItem(sid,k){mS=sid;mK=k;fill(0);modal.classList.add('on');modal.setAttribute('aria-hidden','false');document.body.classList.add('lock');$('mx').focus({preventScroll:true})}
function step(d){const ks=listIdx(SM[mS]),p=ks.indexOf(mK)+d;if(p<0||p>=ks.length)return;mK=ks[p];whoosh();buzz(8);fill(d)}
function closeItem(){if(!modal.classList.contains('on'))return;modal.classList.remove('on');modal.setAttribute('aria-hidden','true');document.body.classList.remove('lock');if(SS)SS.cancel()}
$('mx').onclick=closeItem;$('mpv').onclick=()=>step(-1);$('mnx').onclick=()=>step(1);
$('ml').onclick=()=>{if(SS&&SS.speaking){SS.cancel();return}say(dishText(SM[mS].items[mK]),true)};
modal.addEventListener('click',e=>{if(e.target===modal)closeItem()});
let tx0=null,ty0=0;mc.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY},{passive:true});
mc.addEventListener('touchend',e=>{if(tx0===null)return;const dx=e.changedTouches[0].clientX-tx0,dy=e.changedTouches[0].clientY-ty0;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)step(dx<0?1:-1);tx0=null});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeItem();closeAll()}if(modal.classList.contains('on')){if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)}});
/* intro */
const intro=$('intro');let started=false;
function start(){if(started)return;started=true;ac();gong();
  if(SS){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;SS.speak(u)}catch(e){}}
  intro.classList.add('go');
  setTimeout(()=>{intro.classList.add('out');document.body.classList.remove('lock');if(!muted)say(UI('welcome'),true)},3200)}
$('enter').onclick=e=>{e.stopPropagation();start()};
intro.addEventListener('click',e=>{if(!e.target.closest('.iflags'))start()});
$('upd').onclick=()=>{location.href=location.pathname+'?u='+Date.now()};
build();fabUI();
</script>
